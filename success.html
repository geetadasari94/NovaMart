<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful | ShopEase</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

.success-container{

display:flex;
justify-content:center;
align-items:center;
min-height:80vh;
padding:40px;
background:#f5f7fa;

}

.success-card{

background:white;
padding:50px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
text-align:center;
max-width:650px;
width:100%;

}

.success-icon{

font-size:90px;
color:#28a745;
margin-bottom:20px;
animation:pop 1s ease;

}

@keyframes pop{

0%{transform:scale(0);}
70%{transform:scale(1.2);}
100%{transform:scale(1);}

}

.success-card h1{

color:#28a745;
margin-bottom:20px;

}

.success-card p{

font-size:18px;
margin:15px 0;

}

.order-box{

background:#f8f9fa;
padding:20px;
border-radius:10px;
margin:30px 0;

}

.btn-group{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;

}

.btn{

padding:14px 28px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
text-decoration:none;

}

.btn:hover{

background:#084298;

}

</style>

</head>

<body>

<header>

<div class="logo">

<a href="index.html">

<h2>🛒 ShopEase</h2>

</a>

</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="wishlist.html">Wishlist</a></li>

<li><a href="cart.html">Cart</a></li>

<li><a href="profile.html">Profile</a></li>

</ul>

</nav>

</header>

<section class="success-container">

<div class="success-card">

<div class="success-icon">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>

Order Placed Successfully!

</h1>

<p>

Thank you for shopping with ShopEase.

</p>

<div class="order-box">

<h3>

Order ID

</h3>

<h2 id="orderID">

</h2>

<p>

Estimated Delivery

</p>

<h3 id="deliveryDate">

</h3>

</div>

<div class="btn-group">

<a href="products.html" class="btn">

Continue Shopping

</a>

<a href="profile.html" class="btn">

My Profile

</a>

</div>

</div>

</section>

<footer>

<p style="text-align:center;padding:25px;background:#111;color:white;">

© 2026 ShopEase | All Rights Reserved

</p>

</footer>

<script>

localStorage.removeItem("cart");

const orderNumber="SE"+Math.floor(Math.random()*900000+100000);

document.getElementById("orderID").innerHTML=orderNumber;

const today=new Date();

today.setDate(today.getDate()+5);

document.getElementById("deliveryDate").innerHTML=today.toDateString();

</script>

</body>

</html>
