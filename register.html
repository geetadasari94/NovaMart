<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | ShopEase</title>

<link rel="stylesheet" href="css/login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="login-box">

<div class="left">

<h1>🛒 ShopEase</h1>

<p>

Create your account and start shopping with us.

</p>

<img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=700"
alt="Register">

</div>

<div class="right">

<h2>Create Account</h2>

<form id="registerForm">

<div class="input-box">

<i class="fa fa-user"></i>

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa fa-phone"></i>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<button type="submit">

Register

</button>

<p class="register-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

<p>

<a href="index.html">

← Back to Home

</a>

</p>

</form>

</div>

</div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
